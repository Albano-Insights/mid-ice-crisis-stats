<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mid Ice Crisis Stats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <h1>🏒 Mid Ice Crisis</h1>
  <span class="sub">f.k.a. Globo Gym King Cobras D &middot; BH Adult League, Division D</span>
  <span class="stamp" id="stamp"></span>
</div>

<nav class="tabs" id="tabs">
  <button data-view="overview" class="active">Overview</button>
  <button data-view="scouting">Scouting Report</button>
  <button data-view="insights">Insights</button>
  <button data-view="leaderboards">Leaderboards</button>
  <button data-view="games">Games</button>
  <button data-view="head-to-head">Head-to-Head</button>
  <button data-view="schedule">Schedule</button>
  <button data-view="league">League Outliers</button>
  <button data-view="metrics">Metrics</button>
</nav>

<main>
  <section class="view active" id="view-overview"></section>
  <section class="view" id="view-scouting"></section>
  <section class="view" id="view-insights"></section>
  <section class="view" id="view-leaderboards"></section>
  <section class="view" id="view-games"></section>
  <section class="view" id="view-head-to-head"></section>
  <section class="view" id="view-schedule"></section>
  <section class="view" id="view-league"></section>
  <section class="view" id="view-metrics"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.js"></script>
<script src="app.js"></script>
<script data-goatcounter="https://midicecrisis.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
