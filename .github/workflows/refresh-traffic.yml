name: Refresh traffic stats

on:
  schedule:
    - cron: "30 9 * * *"  # shortly after the data refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-traffic
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull GoatCounter stats
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python scripts/fetch_traffic.py

      - name: Commit changes
        # Same non-fast-forward race as refresh-data: rebase onto origin/main and retry rather
        # than losing the pull. Only traffic.json is staged, and nothing else writes it, so a
        # rebase here never has anything to conflict with.
        run: |
          git config user.name "mid-ice-crisis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/traffic.json
          if git diff --cached --quiet; then
            echo "No traffic changes."
            exit 0
          fi
          git commit -m "Automated traffic refresh"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "Push still failing after 3 attempts." >&2
          exit 1
