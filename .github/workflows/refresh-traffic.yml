name: Refresh traffic stats

on:
  schedule:
    - cron: "30 9 * * *"  # shortly after the data refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-traffic
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull GoatCounter stats
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python scripts/fetch_traffic.py

      - name: Commit changes
        run: |
          git config user.name "mid-ice-crisis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/traffic.json
          if git diff --cached --quiet; then
            echo "No traffic changes."
          else
            git commit -m "Automated traffic refresh"
            git push
          fi
