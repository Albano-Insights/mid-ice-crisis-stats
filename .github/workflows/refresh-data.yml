name: Refresh stats data

on:
  schedule:
    - cron: "0 9 * * *"  # 04:00/05:00 America/New_York, off-peak
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape league site
        run: python scripts/scrape.py

      - name: Build derived site data
        run: python scripts/build_site_data.py

      - name: Sync derived data into site/
        run: |
          rm -rf site/data
          mkdir -p site/data
          cp -r data/derived/* site/data/

      - name: Commit changes
        run: |
          git config user.name "mid-ice-crisis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Automated data refresh"
            git push
          fi
