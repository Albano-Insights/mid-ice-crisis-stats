name: Refresh stats data

on:
  schedule:
    - cron: "0 9 * * *"  # 04:00/05:00 America/New_York, off-peak
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Parser tests (fail fast if the league site's markup changed)
        run: python -m pytest -q

      - name: Scrape league site
        run: python scripts/scrape.py

      - name: Build derived site data
        run: python scripts/build_site_data.py

      - name: Sync game film to the scoresheet (new videos only; never blocks the refresh)
        continue-on-error: true
        run: |
          pip install -r requirements-film.txt
          python scripts/film_sync.py --max-new 2

      - name: Sync derived data into docs/
        # Mirror data/derived -> docs/data, deleting stale files (a player who dropped out of the
        # index, a regenerated game), but never traffic.json: that one is written by the separate
        # refresh-traffic workflow, and a plain rm -rf here used to wipe it every night.
        run: |
          mkdir -p docs/data
          rsync -a --delete --exclude traffic.json data/derived/ docs/data/

      - name: Commit changes
        run: |
          git config user.name "mid-ice-crisis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Automated data refresh"
            git push
          fi
