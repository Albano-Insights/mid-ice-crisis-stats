name: Refresh stats data

on:
  schedule:
    # One cron only. 05:30 UTC is 00:30 EST and 01:30 EDT -- past midnight Eastern in both DST
    # regimes, so the night's results are posted either way. Do NOT reintroduce a second cron
    # with an hour-of-day gate to pin this to exactly 12:30 AM Eastern: GitHub starts scheduled
    # jobs hours late (measured on this repo: 5-8h behind the cron, every day), so a gate
    # comparing the local hour to "00" skipped every scheduled run and the data silently went
    # stale for two weeks. The refresh is an idempotent full rebuild, so an hour of drift costs
    # nothing.
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Parser tests (fail fast if the league site's markup changed)
        run: python -m pytest -q

      - name: Scrape league site
        run: python scripts/scrape.py

      - name: Build derived site data
        run: python scripts/build_site_data.py

      - name: Report division games whose result never landed
        # build_site_data.py flags a division game whose date has passed with no posted result --
        # the fight/injury/forfeit case, which is otherwise invisible: it drops out of the
        # standings but still counts as a game remaining in the outlook. This puts it on the run
        # page as an annotation instead of burying it in the build log. Deliberately never fails:
        # an unposted scoresheet is the league's doing, not a broken refresh.
        run: python scripts/report_data_health.py

      - name: Sync game film to the scoresheet (new videos only; never blocks the refresh)
        continue-on-error: true
        run: |
          pip install -r requirements-film.txt
          python scripts/film_sync.py --max-new 2

      - name: Stamp asset links (cache-busting)
        run: python scripts/stamp_assets.py

      - name: Sync derived data into docs/
        # Mirror data/derived -> docs/data, deleting stale files (a player who dropped out of the
        # index, a regenerated game), but never traffic.json: that one is written by the separate
        # refresh-traffic workflow, and a plain rm -rf here used to wipe it every night.
        run: |
          mkdir -p docs/data
          rsync -a --delete --exclude traffic.json data/derived/ docs/data/

      - name: Commit changes
        # The job checked out main five minutes ago and anything pushed since then (your own
        # commits, the traffic workflow) makes a plain push a non-fast-forward, which used to
        # throw away the whole refresh. Rebase onto origin/main and retry instead. A rebase is
        # safe because data/ and docs/data/ are deterministic regenerations; if one ever does
        # conflict, fail loudly rather than push a half-merge.
        run: |
          git config user.name "mid-ice-crisis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/ docs/*.html
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Automated data refresh"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "Push still failing after 3 attempts." >&2
          exit 1
