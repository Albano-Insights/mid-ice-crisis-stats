name: Process stat correction

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One correction at a time: each run commits and pushes, and parallel runs would race each other.
concurrency:
  group: process-correction
  cancel-in-progress: false

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'stat-correction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Start from the latest main (runs are serialized; the checkout may predate the last one)
        run: |
          git config user.name "mid-ice-crisis-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main

      - name: Write issue body to file
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > issue_body.txt

      - name: Parse and write correction
        id: parse
        run: |
          python scripts/process_correction_issue.py \
            --body-file issue_body.txt \
            --issue-number "${{ github.event.issue.number }}" \
            --author "${{ github.event.issue.user.login }}" \
            --created-at "${{ github.event.issue.created_at }}"

      - name: Rebuild derived site data
        run: |
          python scripts/build_site_data.py
          mkdir -p docs/data
          # never wipe traffic.json: the refresh-traffic workflow owns it
          rsync -a --delete --exclude traffic.json data/derived/ docs/data/

      # The build applies what it can and records the rest in _correction_errors, so it exits 0
      # even when this correction never landed -- which is how #57, #111 and #124 all got an
      # "Applied to the dashboard" comment while the dashboard kept the old number. Check before
      # committing: a correction that still can't apply is aimed at the wrong goal or field, so
      # don't persist it -- fail, comment, and leave the issue open.
      - name: Fail if the correction was recorded but not applied
        run: python scripts/verify_correction_applied.py --issue-number "${{ github.event.issue.number }}"

      - name: Commit correction + rebuilt data
        run: |
          git add data/corrections/ data/derived/ docs/data/
          git commit -m "Apply stat correction from issue #${{ github.event.issue.number }}"
          # Only unrelated commits (a data refresh, an on-ice tag) can have landed since the pull
          # above -- this is what made corrections #63/#72 fail with "fetch first". Never autostash.
          git pull --rebase origin main
          git push

      - name: Comment and close the issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Applied to the dashboard. Thanks for the fix! (If this wasn't right, reopen this issue or file a follow-up correction.)",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Couldn't apply this correction, so the dashboard is unchanged and this issue stays open. Either a required field is missing, or the goal/field it points at didn't match — check the period, time and \"current (wrong) number\" against the box score. The run log says which.",
            });
