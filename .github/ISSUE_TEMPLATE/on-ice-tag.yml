name: On-ice tag
description: Who was on the ice for a goal (feeds +/-). Normally pre-filled from the "Tag on-ice" button on a box score.
title: "On-ice tag: game GAME_ID"
labels: ["on-ice-tag"]
body:
  - type: input
    id: game_id
    attributes:
      label: Game ID
    validations:
      required: true
  - type: input
    id: scoring_team_name
    attributes:
      label: Who scored
      placeholder: "Motorboatin' Joes"
  - type: dropdown
    id: team
    attributes:
      label: Scoring side on the scoresheet (home/away — pre-filled, leave as is)
      options: [home, away]
    validations:
      required: true
  - type: input
    id: period
    attributes:
      label: Period
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time on the scoresheet (e.g. 7:40)
    validations:
      required: true
  - type: input
    id: home_team_name
    attributes:
      label: Home team (pre-filled)
  - type: input
    id: on_ice_home
    attributes:
      label: Home team skaters on the ice (jersey numbers, comma-separated)
      placeholder: "9, 12, 24, 7, 15"
  - type: input
    id: away_team_name
    attributes:
      label: Away team (pre-filled)
  - type: input
    id: on_ice_away
    attributes:
      label: Away team skaters on the ice (jersey numbers, comma-separated)
      placeholder: "3, 8, 19, 22, 44"
  - type: input
    id: video_t
    attributes:
      label: Video time where it went in, if the ▶ link was wrong (optional)
      placeholder: "13:33"
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
