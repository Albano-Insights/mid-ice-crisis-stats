name: Stat correction
description: Fix a wrong goal scorer or assist in a game's box score
title: "Stat correction: game GAMEID"
labels: ["stat-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this to fix a scorer or assist the league's scoresheet got wrong. If you got here from the
        "Suggest a fix" button on a game's box score, most of this is already filled in — just check it
        and submit.
  - type: input
    id: game_id
    attributes:
      label: Game ID
      description: The numeric game id (shown on the box score page/URL).
    validations:
      required: true
  - type: input
    id: scoring_team_name
    attributes:
      label: Who scored
      description: The team credited with the goal (pre-filled from the box score).
      placeholder: "Motorboatin' Joes"
    validations:
      required: true
  - type: input
    id: home_team_name
    attributes:
      label: Home team (pre-filled)
  - type: input
    id: away_team_name
    attributes:
      label: Away team (pre-filled)
  - type: input
    id: period
    attributes:
      label: Period
      description: Exactly as shown on the box score (e.g. "1", "3", "OT1").
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time
      description: Exactly as shown on the box score (e.g. "4:32").
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: What's wrong
      description: "scorer, assist1 or assist2 (pre-filled from the box score)."
      placeholder: scorer
    validations:
      required: true
  - type: input
    id: original
    attributes:
      label: Who it is now (wrong)
      description: >
        The jersey number the box score currently shows, or the player's name if it shows one.
        Leave blank if the field is currently empty (e.g. adding a missed assist).
  - type: input
    id: corrected
    attributes:
      label: Who it should be
      description: >
        A jersey number, or the player's name exactly as the box score spells it. Use the name
        when two players on that sheet wear the number — a sub who brought their own jersey — since
        the number alone can't say which of them it was. Pre-filled if you came from the box score.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason (optional)
      description: "Optional. How do you know? It shows on the goal's ✎ marker, so it's worth a line when the fix isn't obvious -- but skip it freely."
